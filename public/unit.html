<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="google" content="notranslate">
  <title id="pageTitle">Rental Unit</title>
  <meta name="description" content="View EcoRent USA rental details, photos, location, amenities, and begin the rental application.">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preload" as="image" href="/images/flags/us.png">
  <link rel="preload" as="image" href="/images/flags/es.png">
  <link rel="stylesheet" href="css/unit.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="unit-layout container">
    <div class="left-column">
      <div class="carousel card"> 
        <div class="carousel-inner" id="carousel">
          <div class="price-badge" id="unitPrice"></div>
        </div>
      </div>

      <div class="map card">
        <h2 class="section-title section-title-small" data-i18n="location">Location & Directions</h2>
        <iframe
          id="mapFrame"
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="details card">
      <p class="unit-kicker" data-i18n="unit_available_residence">Available residence</p>
      <h1 class="section-title" id="unitTitle"></h1>
      <ul id="unitDetails"></ul>
      <div class="apply-panel-inline action-panel-loading" id="unitActionPanel" aria-busy="true" aria-live="polite">
        <span class="loading-status" data-i18n="unit_options_loading">Loading property options...</span>
        <div class="action-skeleton" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="/js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script type="module" src="/js/unit.js"></script>
</body>
</html>
